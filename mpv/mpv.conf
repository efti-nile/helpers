# --- Screenshots ---
# Set the save directory to the 'mpv' folder on the user's Desktop
screenshot-directory="~~desktop/mpv"
# Set the filename pattern (OriginalFilename_F_FrameNumber)
screenshot-template="%F_F%{estimated-frame-number}"
# Save screenshots as PNG
screenshot-format=png
# PNG compression level (0-9; 5 is a balanced default for file size vs. speed)
screenshot-png-compression=5
# Output screenshots with the same bit depth as the source video
screenshot-high-bit-depth=yes

# --- System & Playback ---
# Set the mpv process priority to high (Windows only)
priority=high
# Pause at the last frame instead of closing the player when the video ends
keep-open=yes
# Enable safe, automatic hardware decoding
hwdec=auto-safe

# --- UI & OSD ---
# Custom OSD text showing detailed time, duration, percentage, and frame counts
osd-status-msg=${playback-time/full} / ${duration} (${percent-pos}%)\nframe: ${estimated-frame-number} / ${estimated-frame-count}

# Disable moving the window by dragging the video area
# Otherwise, MBTN_LEFT click cannot be configured to pan
window-dragging=no

# When a directory is opened, add only videos to the playlist
directory-filter-types=video

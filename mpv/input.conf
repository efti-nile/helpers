# Rotation
r cycle-values video-rotate 90 180 270 0
R cycle-values video-rotate 270 180 90 0

# Default Navigation (Arrow Keys)
LEFT   seek -5
RIGHT  seek  5
DOWN   seek -60
UP     seek  60

# Pan (WASD)
a add video-pan-x  0.025
d add video-pan-x -0.025
w add video-pan-y  0.025
s add video-pan-y -0.025

# Zoom (Shift + W / S)
W add video-zoom  0.1
S add video-zoom -0.1

# Reset Pan and Zoom
q set video-zoom 0; set video-pan-x 0; set video-pan-y 0

# Quit (Displaced from 'q')
ESC quit
Q   quit

# Screenshot w/o subtitles
Ctrl+S screenshot video

# Mouse Wheel Navigation
WHEEL_UP     seek  10
WHEEL_DOWN   seek -10
WHEEL_RIGHT  seek   2
WHEEL_LEFT   seek  -2

# Right button for pause/play
MBTN_RIGHT cycle pause

# Drag using Left button to Pan video
MBTN_LEFT script-binding image_positioning/drag-to-pan

# MBTN_FORWARD add video-zoom  0.1
# MBTN_BACK    add video-zoom -0.1

# Zoom In (Side mouse button sends Ctrl+Tab actually)
Ctrl+TAB       add video-zoom  0.2

# Zoom Out (Side mouse button sends Shift+Ctrl+Tab actually)
Ctrl+Shift+TAB add video-zoom -0.2

# Shuffle Playlist
Ctrl+Alt+s playlist-shuffle
